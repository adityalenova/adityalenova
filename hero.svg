<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a14"/>
      <stop offset="55%" stop-color="#160f2b"/>
      <stop offset="100%" stop-color="#231541"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7D3FF"/>
    </linearGradient>

    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="1.15" fill="#C77DFF" fill-opacity="0.35"/>
    </pattern>

    <radialGradient id="fade" cx="72%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="380" fill="url(#bg)"/>

  <!-- halftone dot field, right side -->
  <rect x="600" width="600" height="380" fill="url(#dots)"/>
  <rect x="600" width="600" height="380" fill="url(#fade)"/>

  <!-- jagged shard accents, echoing spiky silhouette -->
  <g opacity="0.5">
    <polygon points="740,0 820,0 780,140 700,90" fill="url(#accent)" opacity="0.35"/>
    <polygon points="860,0 960,0 900,170 830,110" fill="url(#accent)" opacity="0.25"/>
    <polygon points="1000,0 1100,0 1040,150 970,95" fill="url(#accent)" opacity="0.3"/>
    <polygon points="640,40 700,10 690,120 620,130" fill="url(#accent)" opacity="0.2"/>
  </g>

  <!-- pulsing accent dot, echoing the eye -->
  <circle cx="905" cy="205" r="5" fill="#C77DFF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6.5;4" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- thin diamond rule -->
  <g fill="#8B5CF6" opacity="0.8">
    <rect x="80" y="118" width="5" height="5" transform="rotate(45 82.5 120.5)"/>
  </g>

  <!-- name -->
  <text x="80" y="175" font-family="Verdana, Geneva, sans-serif" font-size="58" font-weight="700" fill="url(#textGlow)" letter-spacing="1">
    ADITYA DUGGIRALA
  </text>

  <!-- tagline, typewriter-style reveal -->
  <text x="80" y="215" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#C77DFF" letter-spacing="1">
    <tspan>◈ SOLO AI BUILDER · HYDERABAD, INDIA ◈</tspan>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="80" y="248" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9A8BC4" letter-spacing="0.5">
    ECE UNDERGRAD, VNRVJIET  ·  SHIPPING ONE REPO AT A TIME
  </text>

  <!-- underline sweep -->
  <rect x="80" y="270" width="0" height="3" fill="url(#accent)">
    <animate attributeName="width" values="0;260;260" keyTimes="0;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom hairline -->
  <rect x="0" y="0" width="1200" height="380" fill="url(#edgeFade)"/>
  <rect x="0" y="377" width="1200" height="3" fill="url(#accent)" opacity="0.6"/>
</svg>
