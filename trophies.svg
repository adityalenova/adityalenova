<svg width="730" height="136" viewBox="0 0 730 136" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1836"/>
      <stop offset="100%" stop-color="#120E22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <linearGradient id="shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>

    <!-- laurel branch (left side); mirrored for the right side -->
    <g id="laurel">
      <path d="M-22,12 C-31,-1 -29,-18 -18,-27" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="-27.5" cy="6"   rx="4" ry="1.9" transform="rotate(-38 -27.5 6)"   fill="currentColor"/>
      <ellipse cx="-29"   cy="-4"  rx="4" ry="1.9" transform="rotate(-62 -29 -4)"    fill="currentColor"/>
      <ellipse cx="-27"   cy="-14" rx="4" ry="1.9" transform="rotate(-84 -27 -14)"   fill="currentColor"/>
      <ellipse cx="-21.5" cy="-23" rx="4" ry="1.9" transform="rotate(-108 -21.5 -23)" fill="currentColor"/>
    </g>

    <!-- trophy cup -->
    <g id="cup">
      <path d="M-13,-18 H-19 C-19,-6 -16,-2 -10,0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M13,-18 H19 C19,-6 16,-2 10,0"   fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-14,-22 H14 V-8 C14,4 7,10 0,10 C-7,10 -14,4 -14,-8 Z" fill="currentColor"/>
      <path d="M-14,-22 H14 V-8 C14,4 7,10 0,10 C-7,10 -14,4 -14,-8 Z" fill="url(#shade)"/>
      <rect x="-3" y="10" width="6" height="7" fill="currentColor"/>
      <rect x="-11" y="17" width="22" height="5" rx="2" fill="currentColor"/>
      <rect x="-11" y="17" width="22" height="5" rx="2" fill="url(#shade)"/>
    </g>
  </defs>

  <style>
    .t  { font: 700 10.5px Verdana, Geneva, sans-serif; fill: #F1E6FF; text-anchor: middle; letter-spacing: 0.7px; }
    .rn { font: 600 9.5px Consolas, 'Courier New', monospace; text-anchor: middle; letter-spacing: 0.4px; }
    .v  { font: 700 10.5px Verdana, Geneva, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .rk { font: 800 12px Verdana, Geneva, sans-serif; text-anchor: middle; }
  </style>
  <!-- AGENT ARENA -->
  <g transform="translate(4,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#FFC83D" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">AGENT ARENA</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#FFC83D" opacity="0.7"/>
    <circle cx="56" cy="62" r="30" fill="#FFC83D" opacity="0.10">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(56,62)" style="color:#FFC83D">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:10.5px" fill="#2A1E00">SSS</text>
    </g>
    <text class="rn" x="56" y="100" fill="#FFC83D">Champion</text>
    <text class="v"  x="56" y="112">1st Place</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;88;88" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- PRODUCTS -->
  <g transform="translate(126,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#FFC83D" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">PRODUCTS</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#FFC83D" opacity="0.7"/>
    <circle cx="56" cy="62" r="30" fill="#FFC83D" opacity="0.10">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(56,62)" style="color:#FFC83D">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:12px" fill="#2A1E00">SS</text>
    </g>
    <text class="rn" x="56" y="100" fill="#FFC83D">Solo Shipper</text>
    <text class="v"  x="56" y="112">7 Live</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="62" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;62;62" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- DATATHON -->
  <g transform="translate(248,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#FFC83D" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">DATATHON</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#FFC83D" opacity="0.7"/>
    <circle cx="56" cy="62" r="30" fill="#FFC83D" opacity="0.10">
      <animate attributeName="opacity" values="0.05;0.18;0.05" dur="3s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(56,62)" style="color:#FFC83D">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:14px" fill="#2A1E00">S</text>
    </g>
    <text class="rn" x="56" y="100" fill="#FFC83D">Civic Builder</text>
    <text class="v"  x="56" y="112">KSP 2026</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="53" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;53;53" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- SYMPOSIUM -->
  <g transform="translate(370,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#A378FF" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">SYMPOSIUM</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#A378FF" opacity="0.7"/>
    <g transform="translate(56,62)" style="color:#A378FF">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:10.5px" fill="#FFFFFF">AAA</text>
    </g>
    <text class="rn" x="56" y="100" fill="#A378FF">Competitor</text>
    <text class="v"  x="56" y="112">2 Events</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="40" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;40;40" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- GENESIS -->
  <g transform="translate(492,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#A378FF" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">GENESIS</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#A378FF" opacity="0.7"/>
    <g transform="translate(56,62)" style="color:#A378FF">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:12px" fill="#FFFFFF">AA</text>
    </g>
    <text class="rn" x="56" y="100" fill="#A378FF">Agent Architect</text>
    <text class="v"  x="56" y="112">Multi-Model</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="48" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;48;48" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- CERTIFICATES -->
  <g transform="translate(614,4)">
    <rect width="112" height="128" rx="8" fill="url(#card)" stroke="#E08BFF" stroke-opacity="0.45"/>
    <text class="t" x="56" y="17">CERTIFICATES</text>
    <rect x="40" y="22" width="32" height="1.6" rx="0.8" fill="#E08BFF" opacity="0.7"/>
    <g transform="translate(56,62)" style="color:#E08BFF">
      <use href="#laurel"/>
      <use href="#laurel" transform="scale(-1,1)"/>
      <use href="#cup"/>
      <text class="rk" x="0" y="-3" style="font-size:14px" fill="#2A0B3A">A</text>
    </g>
    <text class="rn" x="56" y="100" fill="#E08BFF">Certified</text>
    <text class="v"  x="56" y="112">2 Earned</text>
    <rect x="12" y="118" width="88" height="4" rx="2" fill="#2A2244"/>
    <rect x="12" y="118" width="35" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;35;35" keyTimes="0;0.3;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
